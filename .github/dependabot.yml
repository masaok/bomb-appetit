version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # next, react and react-dom are pinned to exact versions on purpose: they move
      # together, and eslint-config-next must match next. Upgrade them by hand.
      - dependency-name: next
      - dependency-name: eslint-config-next
      - dependency-name: react
      - dependency-name: react-dom
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
